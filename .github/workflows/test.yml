name: Test and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Apps Script
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: apps-script-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON_BASE64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          if [ -z "$CLASPRC_JSON_BASE64" ]; then
            echo "::error::Missing CLASPRC_JSON_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON_BASE64" | base64 --decode > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configure Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$APPS_SCRIPT_ID" ]; then
            echo "::error::Missing APPS_SCRIPT_ID repository secret."
            exit 1
          fi
          printf '{"scriptId":"%s","rootDir":"src"}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Show Apps Script files
        run: npm run apps:status

      - name: Push to Apps Script
        run: npx clasp push

      - name: Redeploy public stats endpoint
        env:
          PUBLIC_STATS_DEPLOYMENT_ID: ${{ secrets.PUBLIC_STATS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$PUBLIC_STATS_DEPLOYMENT_ID" ]; then
            echo "::notice::PUBLIC_STATS_DEPLOYMENT_ID is not configured; skipping the initial web app redeploy."
            exit 0
          fi
          VERSION_NUMBER=$(npx clasp --json version "GitHub $GITHUB_SHA" | jq -r '.versionNumber')
          if ! [[ "$VERSION_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to create an Apps Script version."
            exit 1
          fi
          npx clasp --json redeploy "$PUBLIC_STATS_DEPLOYMENT_ID" \
            --versionNumber "$VERSION_NUMBER" \
            --description "Public training stats from $GITHUB_SHA"

      - name: Remove clasp credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
