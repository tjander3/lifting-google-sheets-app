name: Test and deploy

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Apps Script
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: apps-script-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON_BASE64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          if [ -z "$CLASPRC_JSON_BASE64" ]; then
            echo "::error::Missing CLASPRC_JSON_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON_BASE64" | base64 --decode > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Show Apps Script files
        run: npm run apps:status

      - name: Push to Apps Script
        run: npx clasp push

      - name: Remove clasp credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
